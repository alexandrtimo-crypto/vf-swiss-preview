/* title: Интуитивно-легко */
/* fonts: Nunito:wght@500..900 */
/* Тема видения easy: тёплые светлые цвета, толстый контур, пружинистые движения.
   Общие токены --vf-*; цвета плиток и иллюстраций — --vf-easy-* (компоненты берут их с запасным значением). */
:root {
  --vf-bg: #FFF6EA;
  --vf-bg-2: #FFEFD9;
  --vf-surface: #fff;
  --vf-text: #2A211C;
  --vf-text-2: #6E5E52;
  --vf-muted: #E4DCD3;
  --vf-line: #2A211C;
  --vf-accent: #F0533F;
  --vf-accent-2: #FFD25E;
  --vf-on-accent: #fff;
  --vf-danger: #C23A28;
  --vf-font-display: Nunito, ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --vf-font-text: Nunito, ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --vf-font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --vf-radius: 20px;
  --vf-radius-lg: 34px;
  --vf-ease: cubic-bezier(.34, 1.56, .64, 1);

  /* особые цвета видения easy */
  --vf-easy-ink: #2A211C;          /* обводка рисунков и «объёмные» тени */
  --vf-easy-accent-d: #C23A28;     /* тёмно-красный: выделение в репликах, нижняя грань кнопки */
  --vf-easy-ok: #18A866;           /* «на связи», галочки, включённый переключатель */
  --vf-easy-sun: #FFD25E;
  --vf-easy-sky: #9FD8FF;
  --vf-easy-coral: #FFA98F;
  --vf-easy-lilac: #C8B6FF;
  --vf-easy-mint: #8EE0B8;
  --vf-easy-pink: #FFC2DA;
  --vf-easy-lime: #B9E37A;
  --vf-easy-soft: cubic-bezier(.22, 1, .36, 1);
  --vf-easy-dock-h: 76px;
  color-scheme: light;
}

/* ---------- базовый стиль страницы (раньше был глобальным в easy/style.css) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
.vf-page {
  margin: 0; background: var(--vf-bg); color: var(--vf-text);
  font-family: var(--vf-font-text);
  font-size: 17px; line-height: 1.45; font-weight: 600;
  overflow-x: hidden;
}
:where(.vf-page) a { color: inherit; }
:where(.vf-page) button { font: inherit; color: inherit; cursor: pointer; }
:where(.vf-page) :where(img, video, svg) { display: block; max-width: 100%; }
:where(.vf-page) :where(h1, h2, h3) { margin: 0; line-height: 1.05; font-weight: 900; letter-spacing: -.02em; font-family: var(--vf-font-display); }
:where(.vf-page) p { margin: 0; }
:focus-visible { outline: 3px solid var(--vf-line); outline-offset: 3px; border-radius: 12px; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}

/* title: Кнопки · легко */
/* Толстый контур, объёмная тень снизу; при нажатии кнопка «проседает». */
.vf-btn {
  --vf-btn-sh: var(--vf-easy-btn-shadow, #1a1411);
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 0 26px; border-radius: 999px; border: 3px solid var(--vf-line);
  font: inherit; font-weight: 900; font-size: 18px; text-decoration: none; cursor: pointer;
  background: var(--vf-surface); color: var(--vf-text);
  box-shadow: 0 5px 0 var(--vf-btn-sh); transform: translateY(0);
  transition: transform .15s var(--vf-ease), box-shadow .15s, background .2s;
  -webkit-tap-highlight-color: transparent;
}
.vf-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--vf-btn-sh); }
.vf-btn:disabled { cursor: default; }
.vf-btn > svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }

.vf-btn--primary { background: var(--vf-accent); color: var(--vf-on-accent); }
.vf-btn--primary > svg { fill: var(--vf-on-accent); stroke: none; }
.vf-btn--ghost { background: var(--vf-surface); }
/* дополнительный (не из контракта): тёмная кнопка; в других шаблонах станет обычной .vf-btn */
.vf-btn--ink { background: var(--vf-text); color: var(--vf-surface); --vf-btn-sh: #000; }

/* маленькая — «чип»-ответ */
.vf-btn--sm {
  gap: 8px; min-height: 48px; padding: 0 18px; border-width: 2.5px;
  font-size: 16px; font-weight: 800; line-height: 1.45;
  --vf-btn-sh: var(--vf-line); box-shadow: 0 3px 0 var(--vf-btn-sh);
}
.vf-btn--sm:active { transform: translateY(3px); box-shadow: 0 0 0 var(--vf-btn-sh); }

/* title: Поля · легко */
/* .vf-field — обёртка label: подпись (span) + поле; .vf-input — поле ввода или textarea. */
.vf-field { display: grid; gap: 6px; }
.vf-field > span { font-weight: 900; font-size: 15px; }
.vf-field > span i { font-style: normal; font-weight: 700; color: var(--vf-text-2); font-size: 13.5px; }
.vf-input {
  box-sizing: border-box; width: 100%; resize: vertical;
  font: inherit; font-weight: 700; font-size: 17px; color: var(--vf-text);
  border: 2.5px solid var(--vf-line); border-radius: 18px; padding: 13px 16px; background: var(--vf-bg);
}
.vf-input:focus { outline: none; border-color: var(--vf-accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--vf-accent) 18%, transparent); }
.vf-input:disabled { opacity: .5; }
.vf-input[aria-invalid=true] { border-color: var(--vf-accent); background: color-mix(in srgb, var(--vf-accent) 9%, var(--vf-surface)); }

/* ── easy-story ── */
/* easy-story: просмотр историй мастерской на весь экран, как в Instagram */
.easy-story { position: fixed; inset: 0; z-index: 130; background: rgba(20,15,12,.92); display: grid; place-items: center; }
.easy-story[hidden] { display: none; }
.easy-story *, .easy-story *::before, .easy-story *::after { box-sizing: border-box; }
.easy-story :where(p) { margin: 0; }
.easy-story :where(button) { font: inherit; color: inherit; cursor: pointer; }
.easy-story :where(img, video, svg) { display: block; max-width: 100%; }
.easy-story .story__frame { position: relative; width: 100%; height: 100%; max-width: 460px; max-height: 100dvh; background: #111; overflow: hidden; animation: easy-story-in .45s var(--vf-ease) both; }
@keyframes easy-story-in { from { transform: scale(.6); opacity: 0; border-radius: 50%; } to { transform: none; opacity: 1; } }
.easy-story .story__bars { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 5px; z-index: 3; }
.easy-story .story__bars span { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.35); overflow: hidden; }
.easy-story .story__bars span i { display: block; height: 100%; width: 0; background: #fff; border-radius: 4px; }
.easy-story .story__bars span.done i { width: 100%; }
.easy-story .story__head { position: absolute; top: 22px; left: 12px; right: 10px; z-index: 4; display: flex; align-items: center; gap: 10px; color: #fff; }
.easy-story .story__head b { flex: 1; font-weight: 900; font-size: 16px; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.easy-story .story__ava { width: 36px; height: 36px; border-radius: 50%; background: var(--vf-accent); border: 2px solid #fff; display: grid; place-items: center; font-weight: 900; font-size: 13px; color: var(--vf-on-accent); }
.easy-story .iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
.easy-story .iconbtn svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; }
.easy-story .story__media { position: absolute; inset: 0; }
.easy-story .story__media img, .easy-story .story__media video { width: 100%; height: 100%; object-fit: cover; animation: easy-story-kb 6s ease-out both; }
@keyframes easy-story-kb { from { transform: scale(1.08); } to { transform: scale(1); } }
.easy-story .story__cap { position: absolute; left: 14px; right: 14px; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 3; background: var(--vf-surface); color: var(--vf-text); border: 3px solid var(--vf-line); border-radius: 22px 22px 22px 6px; padding: 12px 16px; font-weight: 900; font-size: 17px; line-height: 1.25; box-shadow: 0 4px 0 var(--vf-line); animation: easy-story-pop .5s .15s var(--vf-ease) both; }
@keyframes easy-story-pop { from { opacity: 0; transform: scale(.6) translateY(10px); } to { opacity: 1; transform: none; } }
.easy-story .story__tap { position: absolute; top: 70px; bottom: 110px; z-index: 2; border: 0; padding: 0; background: transparent; width: 38%; }
.easy-story .story__tap--l { left: 0; } .easy-story .story__tap--r { right: 0; width: 62%; }
@media (min-width: 760px) {
  .easy-story .story__frame { height: min(820px, 94vh); border-radius: 30px; border: 3px solid var(--vf-line); }
}
@media (prefers-reduced-motion: reduce) {
  .easy-story *, .easy-story *::before, .easy-story *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}


/* ── easy-chat ── */
/* easy-chat: чат с мастером поверх страницы (снизу на телефоне, панель справа на десктопе) */
.easy-chat { position: fixed; inset: 0; z-index: 100; color: var(--vf-text); }
.easy-chat[hidden] { display: none; }
.easy-chat *, .easy-chat *::before, .easy-chat *::after { box-sizing: border-box; }
.easy-chat :where(h3, h4, p) { margin: 0; }
.easy-chat :where(button) { font: inherit; color: inherit; cursor: pointer; }
.easy-chat :where(img, svg) { display: block; max-width: 100%; }
.easy-chat .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.easy-chat .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

.easy-chat .chat__backdrop { position: absolute; inset: 0; background: color-mix(in srgb, var(--vf-easy-ink, #2A211C) 40%, transparent); opacity: 0; transition: opacity .35s; backdrop-filter: blur(3px); }
.easy-chat.open .chat__backdrop { opacity: 1; }
.easy-chat .chat__panel {
  position: absolute; left: 0; right: 0; bottom: 0; top: 10px; background: var(--vf-bg);
  border-radius: 30px 30px 0 0; border: 3px solid var(--vf-line); border-bottom: 0;
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(105%); transition: transform .55s var(--vf-ease);
}
.easy-chat.open .chat__panel { transform: none; }
.easy-chat .chat__head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 14px; background: var(--vf-surface); border-bottom: 3px solid var(--vf-line); }
.easy-chat .chat__ava { width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid var(--vf-line); overflow: hidden; flex: none; background: var(--vf-easy-sun, #FFD25E); }
.easy-chat .chat__ava svg { width: 100%; height: 100%; }
.easy-chat .chat__who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.easy-chat .chat__who b { font-weight: 900; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.easy-chat .chat__who small { color: var(--vf-easy-ok, #18A866); font-weight: 800; font-size: 13px; }
.easy-chat .iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: color-mix(in srgb, var(--vf-text) 7%, transparent); display: grid; place-items: center; flex: none; padding: 0; }
.easy-chat .iconbtn svg { width: 22px; height: 22px; fill: none; stroke: var(--vf-text); stroke-width: 2.6; stroke-linecap: round; }

/* быстрые ответы: кнопки .vf-btn--sm из шаблона кнопок */
.easy-chat .vf-btn.is-sun { background: var(--vf-easy-sun, var(--vf-accent-2)); }
.easy-chat .vf-btn.is-xs { min-height: 38px; padding: 0 12px; font-size: 13.5px; box-shadow: 0 2px 0 var(--vf-btn-sh, var(--vf-line)); border-width: 2px; }
.easy-chat .vf-btn > svg[width="24"] { width: 24px; height: 24px; }

.easy-chat .chat__log { flex: 1; overflow-y: auto; padding: 18px 14px 10px; display: flex; flex-direction: column; gap: 8px; overscroll-behavior: contain;
  background-image: radial-gradient(color-mix(in srgb, var(--vf-text) 6%, transparent) 1.5px, transparent 1.6px); background-size: 22px 22px; }
.easy-chat .msg { max-width: 84%; padding: 11px 15px; border-radius: 22px; border: 2.5px solid var(--vf-line); font-size: 16px; line-height: 1.38; animation: easy-chat-msgIn .45s var(--vf-ease) both; overflow-wrap: anywhere; }
.easy-chat .msg--bot { align-self: flex-start; background: var(--vf-surface); border-bottom-left-radius: 6px; transform-origin: 0 100%; }
.easy-chat .msg--me { align-self: flex-end; background: var(--vf-text); color: var(--vf-surface); border-bottom-right-radius: 6px; transform-origin: 100% 100%; }
.easy-chat .msg--me .ill { width: 34px; height: 34px; display: inline-block; vertical-align: middle; margin: -6px 6px -6px -4px; background: var(--c); border-radius: 10px; border: 2px solid #fff; padding: 1px; }
.easy-chat .msg b { font-weight: 900; }
.easy-chat .msg--bot b { color: var(--vf-easy-accent-d, var(--vf-danger)); }
.easy-chat .msg + .msg--bot:not(.first) { margin-top: -2px; }
.easy-chat .msg__photos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.easy-chat .msg__photos img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; border: 2px solid #fff; }
@keyframes easy-chat-msgIn { from { opacity: 0; transform: scale(.7) translateY(12px); } to { opacity: 1; transform: none; } }
.easy-chat .typing { align-self: flex-start; display: flex; gap: 5px; padding: 15px 18px; background: var(--vf-surface); border: 2.5px solid var(--vf-line); border-radius: 22px 22px 22px 6px; animation: easy-chat-msgIn .3s var(--vf-ease) both; }
.easy-chat .typing i { width: 9px; height: 9px; border-radius: 50%; background: var(--vf-text); animation: easy-chat-dot 1s infinite ease-in-out; }
.easy-chat .typing i:nth-child(2) { animation-delay: .15s } .easy-chat .typing i:nth-child(3) { animation-delay: .3s }
@keyframes easy-chat-dot { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-6px); opacity: 1; } }

.easy-chat .chat__actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px; max-height: 0; overflow: hidden; transition: max-height .4s var(--vf-easy-soft, cubic-bezier(.22, 1, .36, 1)), padding .3s; }
.easy-chat .chat__actions.has { max-height: 340px; padding: 10px 12px 12px; overflow-y: auto; }
.easy-chat .chat__actions .vf-btn { animation: easy-chat-chipIn .5s var(--vf-ease) backwards; }

// VF kit: запуск JS компонентов после сборки страницы
window.VFKit = window.VFKit || {
  parts: {},
  register(id, init) { this.parts[id] = init; },
  boot() {
    document.querySelectorAll('[data-part]').forEach(root => {
      const init = this.parts[root.dataset.part];
      if (!init || root.__vfBooted) return;
      root.__vfBooted = true;
      try { init(root); } catch (err) { console.error(`[VFKit] ${root.dataset.part}:`, err); }
    });
    // По умолчанию «записаться» прокручивает к слоту заявки, если его компонент не перехватил событие
    document.addEventListener('vf:book', e => {
      if (e.defaultPrevented) return;
      document.querySelector('[data-slot="booking"]')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    });
  },
};

</script>

// Общая логика заявки для всех вариантов VF swiss v2: маска телефона и проверка
window.VFLead = (() => {
  function formatPhone(value) {
    let d = value.replace(/\D/g, '');
    if (d.startsWith('8') || d.startsWith('7')) d = d.slice(1);
    d = d.slice(0, 10);
    if (!d) return '';
    let r = '+7 (' + d.slice(0, 3);
    if (d.length > 3) r += ') ' + d.slice(3, 6);
    if (d.length > 6) r += '-' + d.slice(6, 8);
    if (d.length > 8) r += '-' + d.slice(8, 10);
    return r;
  }

  // Проверка заявки перед отправкой.
  // data: { name, phone, contact: 'call'|'telegram', brand, description, photos: File[] }
  // Вернуть { ok: true } или { ok: false, field: 'имя поля', message: 'текст для клиента' }.
  function validateLead(data) {
    // TODO(human): правила проверки заявки
    return { ok: true };
  }

  // Подключает маску к полю телефона
  function bindPhone(input) {
    input.addEventListener('input', () => { input.value = formatPhone(input.value); });
  }

  return { formatPhone, validateLead, bindPhone };
})();

  }

  function scrollLog() { requestAnimationFrame(() => log.scrollTo({ top: log.scrollHeight, behavior: RM ? 'auto' : 'smooth' })); }
  function add(el) { log.appendChild(el); scrollLog(); return el; }
  function msg(html, who = 'bot') {
    const d = document.createElement('div');
    d.className = 'msg msg--' + who;
    d.innerHTML = html;
    return add(d);
  }
  function typingDelay(html) { if (fast()) return 0; if (RM) return 250; return Math.min(1500, 450 + html.replace(/<[^>]+>/g, '').length * 11); }
  function queue(fn) { busy = busy.then(fn).catch(err => console.warn(err)); return busy; }
  async function botNow(html) {
    const d = typingDelay(html);
    if (d) {
      const t = document.createElement('div');
      t.className = 'typing'; t.setAttribute('aria-label', 'печатает…');
      t.innerHTML = '<i></i><i></i><i></i>';
      add(t); await sleep(d); t.remove();
    }
    return msg(html, 'bot');
  }
  const bot = (...lines) => queue(async () => { for (const l of lines) await botNow(l); });

  function setActions(nodes) {
    actions.innerHTML = '';
    nodes.forEach(n => actions.appendChild(n));
    actions.classList.toggle('has', nodes.length > 0);
    scrollLog();
  }
  // быстрый ответ: кнопка .vf-btn--sm; cls: 'primary' | 'sun' | 'xs' (через пробел)
  const CHIP = { primary: 'vf-btn--primary', sun: 'is-sun', xs: 'is-xs' };
  function chip(label, fn, cls = '') {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'vf-btn vf-btn--sm ' + cls.split(' ').filter(Boolean).map(c => CHIP[c]).join(' '); b.innerHTML = label;
    b.addEventListener('click', () => { setActions([]); fn(); });
    return b;
  }
  const mainReplies = () => setActions([
    chip('Записаться', () => { me('Записаться'); startBooking(); }, 'primary'),
    chip('Сколько стоит?', () => askFaq(1, true)),
    chip('Сколько по времени?', () => askFaq(2, true)),
    chip('Другой вопрос', () => { me('Другой вопрос'); other(); })
  ]);
  const me = (html) => msg(html, 'me');

  function greetIfNew() {
    if (started) return;
    started = true;
    msg('Здравствуйте! Я помощник мастерской VF swiss. Подскажу, что делать с часами, и запишу на бесплатную диагностику.', 'bot');
  }

  /* открыть / закрыть */
  function openChat() {
    if (isOpen()) return;
    lastFocus = document.activeElement;
    chat.hidden = false;
    modal.open();
    requestAnimationFrame(() => requestAnimationFrame(() => chat.classList.add('open')));
    setTimeout(() => (matchMedia('(hover: hover)').matches ? field() : $('.iconbtn[data-close]')).focus({ preventScroll: true }), RM ? 0 : 380);
  }
  function closeChat() {
    chat.classList.remove('open');
    modal.close();
    setTimeout(() => { if (!isOpen()) chat.hidden = true; }, RM ? 0 : 450);
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }
  $$('[data-close]').forEach(b => b.addEventListener('click', closeChat));
  document.addEventListener('keydown', e => {
    if (!isOpen() || !modal.top()) return;
    if (e.key === 'Escape') closeChat();
    if (e.key === 'Tab') trap(e, panel);
  });
  function trap(e, box) {
    const f = $$('button:not([disabled]), input:not([hidden]):not([disabled]):not(.hp):not([type=file]), textarea, a[href], [tabindex="0"]', box).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  /* сценарий: плитка */
  function fromTile(id) {
    const T = TILES[id];
    lead.description = T.d;
    openChat();
    greetIfNew();
    const ill = IC.tiles[id];
    const icon = ill ? ill.replace('<svg ', `<svg style="--c:${T.c}" `) : '';
    setActions([]);
    queue(async () => { await sleep(fast() ? 0 : (RM ? 0 : 350)); me(icon + esc(T.t)); });
    bot(...T.say, 'Цену и срок назовём после диагностики, до начала работ. Чем помочь дальше?');
    queue(async () => mainReplies());
  }

  /* сценарий: вопрос; land(target) — «полёт» пузыря из облака вопросов (если есть) */
  function askFaq(i, viaChip = false, land = null) {
    const f = FAQ[i];
    openChat(); greetIfNew(); setActions([]);
    queue(async () => {
      const anim = typeof land === 'function' && !RM && !fast();
      if (!viaChip && anim) await sleep(420);
      const m = me(esc(f.q));
      if (anim) {
        m.style.visibility = 'hidden';
        log.scrollTop = log.scrollHeight;
        try { await land(m); } finally { m.style.visibility = ''; }
      }
    });
    bot(...f.a);
    queue(async () => setActions([
      chip('Записаться', () => { me('Записаться'); startBooking(); }, 'primary'),
      chip('Другой вопрос', () => { me('Другой вопрос'); other(); })
    ]));
  }
  function other() {
    bot('Спрашивайте — напишите своими словами или выберите:');
    queue(async () => setActions([
      ...[0, 3, 5, 10, 11].map(i => chip(esc(FAQ[i].q), () => askFaq(i, true))),
      chip(ICON.tg.replace('viewBox', 'width="22" height="22" viewBox') + 'Написать в Telegram', () => window.open(TG, '_blank', 'noopener'), 'sun')
    ]));
  }

  /* сценарий: запись прямо в чате */
  function startBooking() {
    openChat(); greetIfNew(); setActions([]);
    lead.name = lead.name || '';
    if (lead.name) { bot(`Записываю вас, ${esc(lead.name)}! Какой у вас телефон?`); queue(async () => askPhone()); return; }
    bot('Отлично! Запишу на бесплатную диагностику — это 4 коротких вопроса.', 'Как вас зовут?');
    queue(async () => {
      step = 'name';
      setComposer({ placeholder: 'Ваше имя', ac: 'given-name' });
      setActions(hasForm() ? [chip('Лучше заполню формой', () => openForm())] : []);
    });
  }
  function askPhone() {
    step = 'phone';
    setComposer({ mode: 'tel' });
    setActions([]);
  }
  function askContact() {
    step = 'contact';
    setComposer({ off: true, placeholder: 'Выберите вариант выше' });
    const mk = (val, label, icon, cls) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'bigpick ' + cls; b.innerHTML = icon + label;
      b.addEventListener('click', () => {
        lead.contact = val; setActions([]);
        me(label);
        askBrand();
      });
      return b;
    };
    setActions([mk('call', 'Позвоните мне', ICON.call, 'bigpick--call'), mk('telegram', 'Напишите в Telegram', ICON.tg, 'bigpick--tg')]);
  }
  function askBrand() {
    bot('Какая марка у часов? Можно пропустить.');
    queue(async () => {
      step = 'brand';
      setComposer({ placeholder: 'Марка часов' });
      setActions([...BRANDS.slice(0, 6).map(b => chip(b, () => { lead.brand = b; me(b); askPhoto(); }, 'xs')),
        chip('Пропустить', () => { me('Пропустить'); askPhoto(); }, 'xs sun')]);
    });
  }
  const photoButtons = () => [
    chip(ICON.cam.replace('viewBox', 'width="24" height="24" viewBox') + 'Добавить фото', () => { photoIn.click(); askPhotoAgain(); }, 'sun'),
    chip('Без фото', () => { me('Без фото'); review(); })
  ];
  function askPhoto() {
    bot('Если хотите, пришлите фото часов — мастеру будет проще. Это по желанию.');
    queue(async () => {
      step = 'photo';
      setComposer({ off: true, placeholder: 'Добавьте фото или пропустите' });
      setActions(photoButtons());
    });
  }
  function askPhotoAgain() {
    // если окно выбора закрыли без файлов — вернём кнопки
    setTimeout(() => { if (step === 'photo' && !actions.children.length) setActions(photoButtons()); }, 600);
  }
  photoIn.addEventListener('change', () => {
    const files = [...photoIn.files].filter(f => f.type.startsWith('image/')).slice(0, 5);
    if (!files.length) { if (step === 'photo') setActions(photoButtons()); return; }
    lead.photos = files;
    const m = me(`${files.length} фото`);
    const box = document.createElement('div'); box.className = 'msg__photos';
    files.forEach(f => { const i = new Image(); i.alt = ''; i.src = URL.createObjectURL(f); box.appendChild(i); });
    m.appendChild(box); scrollLog();
    review();
  });

  function summaryChips(d) {
    const parts = [d.name, d.phone, d.contact === 'telegram' ? 'Telegram' : (d.contact === 'call' ? 'Звонок' : ''), d.brand, d.description, d.photos && d.photos.length ? d.photos.length + ' фото' : ''].filter(Boolean);
    return '<div class="review__chips">' + parts.map(p => `<span>${esc(p)}</span>`).join('') + '</div>';
  }
  function review() {
    step = 'review';
    setComposer({ off: true, placeholder: 'Проверьте заявку' });
    bot('Почти готово! Проверьте, всё ли верно:');
    queue(async () => {
      const r = document.createElement('div');
      r.className = 'review';
      r.innerHTML = `<h4>Заявка на диагностику</h4>${summaryChips(lead)}
        <label class="toggle"><input type="checkbox" role="switch" ${consent ? 'checked' : ''}><span class="toggle__ui" aria-hidden="true"></span><span>Согласен на обработку персональных данных</span></label>
        <button class="vf-btn vf-btn--primary" type="button">Отправить заявку</button>`;
      const sw = $('input', r);
      sw.addEventListener('change', () => { consent = sw.checked; });
      $('.vf-btn', r).addEventListener('click', () => submitLead({ ...lead, website: hp.value }, sw, r));
      add(r);
    });
  }

  function submitLead(data, sw, host) {
    if (data.website) { done(data); return; } // ловушка для ботов: молча «принимаем»
    const clean = { name: data.name, phone: data.phone, contact: data.contact, brand: data.brand, description: data.description, photos: data.photos || [] };
    const res = window.VFLead ? VFLead.validateLead(clean) : { ok: true };
    if (!res.ok) {
      bot(esc(res.message || 'Проверьте, пожалуйста, заявку.'));
      if (res.field === 'name') queue(async () => { step = 'name'; setComposer({ placeholder: 'Ваше имя' }); });
      else if (res.field === 'phone') queue(async () => askPhone());
      return;
    }
    if (!sw.checked) {
      const ui = sw.nextElementSibling;
      ui.classList.remove('shake'); void ui.offsetWidth; ui.classList.add('shake');
      bot('Включите, пожалуйста, согласие на обработку данных — без него не можем принять заявку.');
      return;
    }
    $('.vf-btn', host).disabled = true; sw.disabled = true;
    done(clean);
  }

  function done(d) {
    step = 'done';
    setActions([]);
    setComposer({ placeholder: 'Напишите вопрос…' });
    queue(async () => {
      const t = document.createElement('div');
      t.className = 'ticket';
      t.innerHTML = `${ICON.ok}<h4>Заявка принята (прототип)</h4>
        <p>${d.contact === 'telegram' ? 'Напишем вам в Telegram' : 'Перезвоним вам'}, чтобы договориться о бесплатной диагностике.</p>
        ${summaryChips(d)}
        <p class="ticket__note">Это прототип: заявка никуда не отправлена.</p>`;
      add(t);
      if (!RM) confetti(t);
    });
    bot('Спасибо! Если удобнее — звоните: <b>' + PHONE + '</b>.');
    queue(async () => setActions([
      chip('Другой вопрос', () => { me('Другой вопрос'); other(); }),
      chip('Закрыть чат', () => closeChat())
    ]));
  }
  function confetti(host) {
    const cols = ['var(--vf-accent, #F0533F)', 'var(--vf-easy-sun, #FFD25E)', 'var(--vf-easy-sky, #9FD8FF)', 'var(--vf-easy-mint, #8EE0B8)', 'var(--vf-easy-lilac, #C8B6FF)', 'var(--vf-easy-pink, #FFC2DA)'];
    for (let i = 0; i < 26; i++) {
      const c = document.createElement('i');
      c.className = 'confetti';
      c.style.background = cols[i % cols.length];
      c.style.setProperty('--x', (Math.random() * 300 - 150) + 'px');
      c.style.setProperty('--y', (Math.random() * -160 - 30) + 'px');
      c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      host.appendChild(c);
      setTimeout(() => c.remove(), 1200);
    }
  }

  /* свободный вопрос (из поля ввода или из чужого компонента) */
  function freeQuestion(v) {
    me(esc(v)); setActions([]);
    const hit = KEYS.find(([re]) => re.test(v));
    if (hit && hit[1] === -1) { startBooking(); return; }
    if (hit) { bot(...FAQ[hit[1]].a); queue(async () => mainReplies()); return; }
    if (!lead.description || lead.description === 'Нужна диагностика') lead.description = v.slice(0, 300);
    bot('Хороший вопрос — уточним у мастера. Оставьте заявку, и он ответит сам, или напишите нам в Telegram.');
    queue(async () => setActions([
      chip('Записаться', () => { me('Записаться'); startBooking(); }, 'primary'),
      chip(ICON.tg.replace('viewBox', 'width="22" height="22" viewBox') + 'Telegram', () => window.open(TG, '_blank', 'noopener'), 'sun')
    ]));
  }

  /* ввод в чат */
  composer.addEventListener('submit', e => {
    e.preventDefault();
    const f = field();
    const v = f.value.trim();
    if (!v) { f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); return; }
    f.value = '';
    if (step === 'name') {
      if (v.length < 2 || /\d/.test(v)) { me(esc(v)); bot('Кажется, это не похоже на имя. Как к вам обращаться?'); return; }
      lead.name = v.slice(0, 60);
      me(esc(lead.name)); setActions([]);
      bot(`Приятно познакомиться, ${esc(lead.name)}! Какой у вас телефон?`);
      queue(async () => askPhone());
      return;
    }
    if (step === 'phone') {
      const digits = v.replace(/\D/g, '');
      me(esc(v));
      if (digits.length < 11) { bot('Кажется, в номере не хватает цифр. Проверьте, пожалуйста.'); return; }
      lead.phone = v;
      bot('Записал! Как вам удобнее, чтобы мы связались?');
      queue(async () => askContact());
      return;
    }
    if (step === 'brand') {
      lead.brand = v.slice(0, 60); me(esc(lead.brand)); setActions([]);
      askPhoto();
      return;
    }
    freeQuestion(v);
  });

  /* ---------- та же заявка одной карточкой — в компоненте заявки (vf:book { form: true }) ---------- */
  function openForm() {
    openChat();
    emit('vf:book', { form: true, from: ID, lead: { ...lead }, consent });
  }
  toFormBtn.addEventListener('click', openForm);

  /* ---------- связи с другими компонентами ---------- */
  document.addEventListener('vf:chat', e => {
    e.preventDefault();
    const d = e.detail || {};
    if (d.symptom && TILES[d.symptom]) return fromTile(d.symptom);
    if (d.ask) { openChat(); greetIfNew(); me('Хочу спросить'); other(); return; }
    const q = d.question || d.label || '';
    if (q) {
      const i = FAQ.findIndex(f => f.q === q);
      if (i >= 0) return askFaq(i, false, d.land);
      openChat(); greetIfNew(); freeQuestion(q); return;
    }
    openChat(); greetIfNew();
  });
  document.addEventListener('vf:book', e => {
    const d = e.detail || {};
    if (d.form) return; // форма одной карточкой — дело компонента заявки
    e.preventDefault();
    if (step && step !== 'done' && started) { openChat(); return; }
    openChat(); greetIfNew(); startBooking();
  });
  // заявка отправлена формой: итог показываем в чате
  document.addEventListener('vf:lead', e => {
    const d = e.detail || {};
    e.preventDefault();
    openChat(); greetIfNew();
    if (d.website) { done(d); return; }
    Object.assign(lead, { name: d.name, phone: d.phone, contact: d.contact, brand: d.brand, description: d.description, photos: d.photos || [] });
    consent = true; setActions([]);
    me('Отправил заявку формой');
    done(lead);
  });

  /* ---------- демо-режимы для скриншотов ---------- */
  if (DEMO === 'chat') { fromTile('stop'); }
  if (DEMO === 'book') {
    fromTile('glass');
    queue(async () => { setActions([]); me('Записаться'); });
    queue(async () => { started = true; });
    bot('Отлично! Запишу на бесплатную диагностику — это 4 коротких вопроса.', 'Как вас зовут?');
    queue(async () => { lead.name = 'Анна'; me('Анна'); });
    bot('Приятно познакомиться, Анна! Какой у вас телефон?');
    queue(async () => { lead.phone = '+7 (900) 000-00-00'; me(lead.phone); });
    bot('Записал! Как вам удобнее, чтобы мы связались?');
    queue(async () => askContact());
  }
  if (DEMO === 'done') {
    Object.assign(lead, { name: 'Анна', phone: '+7 (900) 000-00-00', contact: 'telegram', brand: 'Cartier', description: 'Разбито или поцарапано стекло' });
    openChat(); greetIfNew(); consent = true;
    review();
    queue(async () => { const r = $$('.review', log).pop() || log.lastElementChild; const sw = $('input', r); if (sw) { sw.checked = true; } done({ ...lead, photos: [] }); });
  }
});

})();
</script>

<script>(function(){var C={"id":"easy-story","key":"vf-opros-v1","n":35,"i":-1,"prev":"../../#stend","next":"../../opros/","last":false,"lift":false};var S;try{S=JSON.parse(localStorage.getItem(C.key)||'{}')}catch(e){S={}}S.e=S.e||{};S.ec=S.ec||{};
var q=document.getElementById('vfq');var like=q.querySelector('.like'),note=q.querySelector('textarea');
function save(){try{localStorage.setItem(C.key,JSON.stringify(S))}catch(e){}}
function paint(){like.setAttribute('aria-pressed',!!S.e[C.id]);like.textContent=S.e[C.id]?'\u2665 Хочу это':'\u2661 Хочу это'}
note.value=S.ec[C.id]||'';if(note.value)q.classList.add('open');paint();
like.onclick=function(){S.e[C.id]=!S.e[C.id];save();paint()};
q.querySelector('.cm').onclick=function(){q.classList.toggle('open');if(q.classList.contains('open'))note.focus()};
note.oninput=function(){S.ec[C.id]=note.value;save()};
})();</script>
