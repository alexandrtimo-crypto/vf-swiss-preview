<title>Марки строкой · элемент</title>

<style>
/* title: PM · Швейцарская глава (дорого-богато) */
/* fonts: Cormorant:ital,wght@0,400..600%3B1,400..500; Montserrat:wght@400..600 */
/* UI UX Pro Max → Luxury/Premium Brand: стиль Minimalism & Swiss Style (дисперсия 2), палитра «Premium black + gold accent»,
   пара «Luxury Serif» (Cormorant + Montserrat), паттерн Scroll-Triggered Storytelling. Плотность 2 → просторная шкала 24–96. */
:root {
  --vf-bg: #FAFAF9;
  --vf-bg-2: #F5F5F4;
  --vf-surface: #FFFFFF;
  --vf-text: #0C0A09;
  --vf-text-2: #44403C;
  --vf-muted: #475569;
  --vf-line: #D6D3D1;
  --vf-accent: #A16207;
  --vf-accent-2: #1C1917;
  --vf-on-accent: #FFFFFF;
  --vf-danger: #B91C1C;
  --vf-font-display: 'Cormorant', 'Times New Roman', serif;
  --vf-font-text: 'Montserrat', system-ui, sans-serif;
  --vf-font-mono: 'Montserrat', system-ui, sans-serif;
  --vf-radius: 0px;
  --vf-radius-lg: 0px;
  --vf-ease: cubic-bezier(.25, .46, .45, .94); /* power1.out — пресет Scroll Reveal · Subtle */
  --vf-dur: 500ms;           /* «Premium reveals (400-600ms)» из ui-reasoning */
  --vf-dur-exit: 320ms;      /* exit-faster-than-enter ≈ 65 % */
  /* Плотность 2 (Spacious) — шкала из DIAL_TIERS */
  --pm-s-xs: 4px; --pm-s-sm: 8px; --pm-s-md: 24px; --pm-s-lg: 32px; --pm-s-xl: 48px; --pm-s-2xl: 64px; --pm-s-3xl: 96px;
  --pm-wrap: 1240px;
  --pm-gutter: clamp(16px, 4vw, 48px);
  --vf-metal: #A16207;
  color-scheme: light;
}
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body.vf-page {
  margin: 0; background: var(--vf-bg); color: var(--vf-text);
  font: 400 16px/1.65 var(--vf-font-text);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-feature-settings: "tnum" 1;
}
body.vf-page :focus-visible { outline: 2px solid var(--vf-accent); outline-offset: 3px; }
body.vf-page img, body.vf-page video { max-width: 100%; display: block; }
body.vf-page a { color: inherit; }
body.vf-page [data-slot] { scroll-margin-top: 80px; }
.pm-skip { position: absolute; left: -9999px; top: 8px; z-index: 1000; background: var(--vf-text); color: var(--vf-bg); padding: 10px 16px; }
.pm-skip:focus { left: 8px; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  body.vf-page *, body.vf-page *::before, body.vf-page *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* title: PM · кнопки швейцарской главы — прямые углы, волосяная рамка, золото только на главном действии */
.vf-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 28px; border: 1px solid var(--vf-text); border-radius: var(--vf-radius);
  background: transparent; color: var(--vf-text); cursor: pointer; text-decoration: none;
  font: 600 13px/1 var(--vf-font-text); letter-spacing: .14em; text-transform: uppercase;
  transition: background-color var(--vf-dur-exit, 300ms) var(--vf-ease), color var(--vf-dur-exit, 300ms) var(--vf-ease), border-color var(--vf-dur-exit, 300ms) var(--vf-ease);
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.vf-btn:hover { background: var(--vf-text); color: var(--vf-bg); }
.vf-btn:active { opacity: .85; }
.vf-btn--primary { background: var(--vf-accent-2); border-color: var(--vf-accent-2); color: var(--vf-on-accent); }
.vf-btn--primary:hover { background: var(--vf-accent); border-color: var(--vf-accent); color: var(--vf-on-accent); }
.vf-btn--ghost { border-color: var(--vf-line); }
.vf-btn--ghost:hover { border-color: var(--vf-text); }
.vf-btn--sm { min-height: 44px; padding: 0 18px; font-size: 12px; }
.vf-btn[disabled], .vf-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.vf-btn svg { width: 18px; height: 18px; flex: none; }
body.vf-page a.vf-btn { color: var(--vf-text); }
body.vf-page a.vf-btn:hover { color: var(--vf-bg); }
body.vf-page a.vf-btn--primary, body.vf-page a.vf-btn--primary:hover { color: var(--vf-on-accent); }

/* title: PM · поля швейцарской главы — подпись над полем, линия снизу, ошибка под полем */
.vf-field { display: grid; gap: 8px; }
.vf-field > label, .vf-field > .vf-field__label { font: 600 12px/1.3 var(--vf-font-text); letter-spacing: .12em; text-transform: uppercase; color: var(--vf-text-2); }
.vf-field__req { color: var(--vf-accent); }
.vf-input {
  width: 100%; box-sizing: border-box; min-height: 52px; padding: 12px 0;
  border: 0; border-bottom: 1px solid var(--vf-line); border-radius: 0; background: transparent;
  color: var(--vf-text); font: 400 17px/1.4 var(--vf-font-text);
  transition: border-color 250ms var(--vf-ease);
}
textarea.vf-input { min-height: 112px; resize: vertical; }
.vf-input::placeholder { color: #78716C; }
.vf-input:hover { border-bottom-color: var(--vf-text-2); }
.vf-input:focus { outline: none; border-bottom: 2px solid var(--vf-accent); }
.vf-input:focus-visible { outline: none; }
.vf-input[aria-invalid="true"] { border-bottom-color: var(--vf-danger); }
.vf-field__hint { font-size: 13px; color: var(--vf-muted); }
.vf-field__error { font-size: 14px; color: var(--vf-danger); min-height: 0; }
.vf-field__error:empty { display: none; }

/* ── pm-lux-brands ── */
.pm-lux-brands { padding: var(--pm-s-2xl, 64px) 0 var(--pm-s-3xl, 96px); }
.pm-lux-brands .pm-lux-brands__wrap { max-width: var(--pm-wrap, 1240px); margin: 0 auto; padding: 0 var(--pm-gutter, 24px); }
.pm-lux-brands .pm-lux-brands__title { margin: 0 0 var(--pm-s-lg, 32px); font: 600 12px/1.4 var(--vf-font-text); letter-spacing: .2em; text-transform: uppercase; color: var(--vf-text-2); }
.pm-lux-brands .pm-lux-brands__list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 0; font: 400 clamp(30px, 4.2vw, 60px)/1.25 var(--vf-font-display); }
.pm-lux-brands .pm-lux-brands__list li::after { content: ""; display: inline-block; width: 1px; height: .6em; margin: 0 .5em; background: var(--vf-accent); transform: rotate(18deg); }
.pm-lux-brands .pm-lux-brands__list li:last-child::after { display: none; }
.pm-lux-brands .pm-lux-brands__etc { font-style: italic; color: var(--vf-text-2); font-size: .62em; }

<script>
// VF kit: запуск JS компонентов после сборки страницы
window.VFKit = window.VFKit || {
  parts: {},
  register(id, init) { this.parts[id] = init; },
  boot() {
    document.querySelectorAll('[data-part]').forEach(root => {
      const init = this.parts[root.dataset.part];
      if (!init || root.__vfBooted) return;
      root.__vfBooted = true;
      try { init(root); } catch (err) { console.error(`[VFKit] ${root.dataset.part}:`, err); }
    });
    // По умолчанию «записаться» прокручивает к слоту заявки, если его компонент не перехватил событие
    document.addEventListener('vf:book', e => {
      if (e.defaultPrevented) return;
      document.querySelector('[data-slot="booking"]')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    });
  },
};

</script>
