  --vf-danger:#ff8a7a;

  --vf-danger-soft:#ff9d8f;

/* title: Кнопки · технологично */
/* Капсулы: люминесцентная основная со свечением и «стеклянная» второстепенная. */
.vf-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;border:0;text-decoration:none;font-family:var(--vf-font-text);font-weight:500;font-size:16px;line-height:1.2;cursor:pointer;white-space:nowrap;transition:transform .35s var(--vf-ease),box-shadow .35s var(--vf-ease),background .35s}
.vf-btn--primary{background:var(--vf-accent);color:var(--vf-on-accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--vf-accent-2) 60%,transparent) inset,0 10px 40px -8px color-mix(in srgb,var(--vf-accent) 55%,transparent)}

.vf-btn--ghost{background:color-mix(in srgb,var(--vf-text) 6%,transparent);color:var(--vf-text);box-shadow:inset 0 0 0 1px var(--vf-line-2,var(--vf-line));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* title: Поля · технологично */

// VF kit: запуск JS компонентов после сборки страницы
window.VFKit = window.VFKit || {
  parts: {},
  register(id, init) { this.parts[id] = init; },
  boot() {
    document.querySelectorAll('[data-part]').forEach(root => {
      const init = this.parts[root.dataset.part];
      if (!init || root.__vfBooted) return;
      root.__vfBooted = true;
      try { init(root); } catch (err) { console.error(`[VFKit] ${root.dataset.part}:`, err); }
    });
    // По умолчанию «записаться» прокручивает к слоту заявки, если его компонент не перехватил событие
    document.addEventListener('vf:book', e => {
      if (e.defaultPrevented) return;
      document.querySelector('[data-slot="booking"]')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    });
  },
};

<script>
/* ── tech-overlay-viewer ── */
;(() => {
/* Полноэкранный просмотрщик снимков. Слушает vf:viewer { items:[{src,alt}], index }.
   Касание — увеличить в точке, листание свайпом или стрелками. */
VFKit.register('tech-overlay-viewer', root => {
  const vImg = root.querySelector('.viewer-img'), vScroll = root.querySelector('.viewer-scroll');
  let list = [], vi = 0;
  function setViewer(i) {
    if (!list.length) return;
    vi = (i + list.length) % list.length;
    vImg.src = list[vi].src; vImg.alt = list[vi].alt || ''; root.classList.remove('zoom');
  }
  document.addEventListener('vf:viewer', e => {
    const d = e.detail || {};
    if (!Array.isArray(d.items) || !d.items.length) return;
    e.preventDefault();
    list = d.items; setViewer(d.index || 0);
    if (typeof root.showModal === 'function') { if (!root.open) root.showModal(); } else root.setAttribute('open', '');
  });
  vImg.addEventListener('click', e => {
    if (root.classList.contains('zoom')) { root.classList.remove('zoom'); return; }
    const r = vImg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    root.classList.add('zoom');
    requestAnimationFrame(() => {
      const W = vImg.offsetWidth, H = vImg.offsetHeight;
      vScroll.scrollLeft = fx * W - vScroll.clientWidth / 2; vScroll.scrollTop = fy * H - vScroll.clientHeight / 2;
    });
  });
  const close = () => { if (typeof root.close === 'function') root.close(); else root.removeAttribute('open'); };
  root.querySelector('.v-close').addEventListener('click', close);
  root.querySelector('.v-prev').addEventListener('click', () => setViewer(vi - 1));
  root.querySelector('.v-next').addEventListener('click', () => setViewer(vi + 1));
  root.addEventListener('keydown', e => { if (e.key === 'ArrowRight') setViewer(vi + 1); if (e.key === 'ArrowLeft') setViewer(vi - 1); });
  let tx0 = null;
  vScroll.addEventListener('touchstart', e => { tx0 = root.classList.contains('zoom') ? null : e.touches[0].clientX; }, { passive: true });
  vScroll.addEventListener('touchend', e => {
    if (tx0 === null) return; const dx = e.changedTouches[0].clientX - tx0;
    if (Math.abs(dx) > 60) setViewer(vi + (dx < 0 ? 1 : -1)); tx0 = null;
  });
});

})();
</script>

<script>// VF kit · звуковой слой. По умолчанию ВЫКЛЮЧЕН: включает посетитель (переключатель [data-sound-toggle]),
// выбор запоминается. Звук только в ответ на действие: [data-sound="click|tick|wind|stamp|tear|paper|success|error"].
// Файлы — kit/sounds/<имя>.{ogg,mp3} (CC0, источники — kit/sounds/SOURCES.md); если файла нет — короткий синтез Web Audio.
(() => {
  if (window.VFSound) return;
  const KEY = 'vf-sound';
  const PACK = () => document.documentElement.dataset.soundPack || 'mechanical';
  let ctx = null, on = false;
  const buffers = new Map();
  try { on = localStorage.getItem(KEY) === 'on'; } catch {}

  const ac = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());

  async function load(name) {
    if (buffers.has(name)) return buffers.get(name);
    const p = (async () => {
      for (const ext of ['ogg', 'mp3']) {
        try {
          const r = await fetch(`../../kit/sounds/${PACK()}/${name}.${ext}`);
          if (r.ok) return await ac().decodeAudioData(await r.arrayBuffer());
        } catch {}
      }
      return null;
    })();
    buffers.set(name, p);
    return p;
  }

  // Синтез на случай отсутствия файла: короткий механический щелчок/тик
  function synth(name, gain) {
    const a = ac(), t = a.currentTime;
    const freq = { tick: 3200, click: 1800, wind: 900, stamp: 140, tear: 600, paper: 500, success: 880, error: 220 }[name] || 1500;
    const len = name === 'stamp' ? 0.12 : name === 'success' ? 0.18 : 0.035;
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = name === 'stamp' || name === 'error' ? 'triangle' : 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (name === 'success') osc.frequency.exponentialRampToValueAtTime(freq * 1.5, t + len);
    g.gain.setValueAtTime(gain * 0.25, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    osc.connect(g).connect(a.destination);
    osc.start(t); osc.stop(t + len + 0.02);
  }

  async function play(name, { volume = 0.6, rate = 1 } = {}) {
    if (!on || !name) return;
    const a = ac(); if (a.state === 'suspended') await a.resume().catch(() => {});
    const buf = await load(name);
    if (!buf) return synth(name, volume);
    const src = a.createBufferSource(), g = a.createGain();
    src.buffer = buf; src.playbackRate.value = rate * (0.97 + Math.random() * 0.06); // живой разброс
    g.gain.value = volume;
    src.connect(g).connect(a.destination); src.start();
  }

  // iPhone глушит веб-звук беззвучным переключателем, пока страница не «играет медиа»: переводим сессию в playback
  // и один раз проигрываем тишину (после жеста пользователя)
  let unlocked = false;
  function unlock() {
    if (unlocked) return; unlocked = true;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
    try {
      const n = 4410, b = new DataView(new ArrayBuffer(44 + n * 2));
      const w = (o, t) => [...t].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
      w(0, 'RIFF'); b.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
      b.setUint32(24, 44100, true); b.setUint32(28, 88200, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true); w(36, 'data'); b.setUint32(40, n * 2, true);
      const a = new Audio(URL.createObjectURL(new Blob([b], { type: 'audio/wav' })));
      a.play().catch(() => {});
    } catch {}
  }

  function set(state, silent = false) {
    on = state;
    try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch {}
    document.querySelectorAll('[data-sound-toggle]').forEach(b => { b.setAttribute('aria-pressed', on); b.dataset.state = on ? 'on' : 'off'; });
    if (on) unlock();
    if (on && !silent) play('success', { volume: 0.7 });   // слышимое подтверждение: звук включён
  }

  // Делегирование: звук по атрибуту на любом элементе, без правки компонентов
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-sound-toggle]');
    if (t) { set(!on); return; }
    const s = e.target.closest('[data-sound]');
    if (s) play(s.dataset.sound);
  });
  // События компонентов: vf:sound { detail: { name } } — например, отрыв талона или штамп после анимации
  document.addEventListener('vf:sound', e => play(e.detail?.name, e.detail));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => set(on, true)); else set(on, true);

  window.VFSound = { play, set, get enabled() { return on; } };
})();
</script>
