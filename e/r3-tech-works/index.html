<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="../../kit/icons/favicon.png">
<title>Верстак · тёмный ангар · элемент</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@600..900&family=Sofia+Sans:wght@400..700&display=swap">
<style>
/* title: Ангар · техобслуживание часов */
/* fonts: Sofia Sans Extra Condensed:wght@600..900; Sofia Sans:wght@400..700 */
/* Мир «авиационное ТО»: алюминиевая обшивка, швы из заклёпок, цинк-хроматный грунт, красная бирка действия. Глобальные правила сайта — только здесь. */
:root{
  --vf-bg:#dce0e3;          /* алюминий обшивки */
  --vf-bg-2:#cdd4d6;        /* соседний лист, тень ангара */
  --vf-surface:#edf1f2;     /* светлая накладка, рамка лючка */
  --vf-text:#1b2125;        /* графит маркировки */
  --vf-text-2:#3c4448;
  --vf-muted:#50585c;
  --vf-line:rgba(27,33,37,.2);
  --vf-accent:#c8241f;      /* красная бирка: только действие */
  --vf-accent-2:#cbd252;    /* цинк-хроматный грунт */
  --vf-on-accent:#ffffff;
  --vf-danger:#9e1418;
  --vf-font-display:"Sofia Sans Extra Condensed","Arial Narrow",system-ui,sans-serif;
  --vf-font-text:"Sofia Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --vf-font-mono:ui-monospace,Menlo,Consolas,monospace;
  --vf-radius:4px;
  --vf-radius-lg:14px;
  --vf-ease:cubic-bezier(.16,1,.3,1);
  /* особые токены мира r3-tech (компоненты читают их с запасным значением) */
  --vf-primer:#cbd252;
  --vf-primer-2:#bcc345;
  --vf-primer-ink:#2b2d0e;
  --vf-graph:#1a1f22;       /* тёмный ангар */
  --vf-graph-2:#262c30;
  --vf-on-graph:#e4e9eb;
  --vf-on-graph-2:#a7afb3;
  --vf-accent-hover:#a91c18;
  --vf-pad:clamp(16px,3.2vw,48px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:76px;scrollbar-color:#8a9397 var(--vf-bg-2);scrollbar-width:thin}
html::-webkit-scrollbar{width:10px;height:10px}
html::-webkit-scrollbar-track{background:var(--vf-bg-2)}
html::-webkit-scrollbar-thumb{background:#8a9397;border:2px solid var(--vf-bg-2);border-radius:2px}
.vf-page{margin:0;background-color:var(--vf-bg);color:var(--vf-text);font-family:var(--vf-font-text);font-weight:400;font-size:17px;line-height:1.5;overflow-x:clip;-webkit-font-smoothing:antialiased;caret-color:var(--vf-accent);font-variant-numeric:lining-nums tabular-nums;
  /* шлифовка листа: еле заметная продольная риска */
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
.vf-page ::selection{background:var(--vf-primer);color:var(--vf-text)}
img,video,canvas,svg{display:block;max-width:100%}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.2em}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vf-text);outline-offset:3px;border-radius:2px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:820px){.vf-page{font-size:16px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* title: Кнопки · бирка и трафарет */
/* Основная — красная бирка с люверсом; второстепенная — трафаретная рамка по металлу. */
.vf-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border:0;border-radius:var(--vf-radius);text-decoration:none;font-family:var(--vf-font-display);font-weight:800;font-size:21px;line-height:1;letter-spacing:.045em;text-transform:uppercase;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:transform .2s var(--vf-ease),background-color .2s,box-shadow .2s,color .2s}
.vf-btn svg{width:18px;height:18px;flex:none}
.vf-btn--primary{padding-left:42px;background:var(--vf-accent);color:var(--vf-on-accent);
  -webkit-mask:radial-gradient(circle 4.5px at 19px 50%,transparent 97%,#000 100%);mask:radial-gradient(circle 4.5px at 19px 50%,transparent 97%,#000 100%);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.vf-btn--primary::before{content:"";position:absolute;left:12px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;box-shadow:inset 0 0 0 2.5px #e9eef0,inset 0 0 0 3.5px rgba(0,0,0,.25)}
.vf-btn--primary:hover{background:var(--vf-accent-hover,#a91c18);transform:translateX(2px)}
.vf-btn--primary:active{transform:translateX(2px) translateY(1px);box-shadow:inset 0 2px 0 rgba(0,0,0,.2)}
.vf-btn--ghost{background:transparent;color:currentColor;box-shadow:inset 0 0 0 1.5px currentColor}
.vf-btn--ghost:hover{background:color-mix(in srgb,currentColor 9%,transparent)}
.vf-btn--ghost:active{transform:translateY(1px)}
.vf-btn--sm{min-height:42px;padding:0 16px;font-size:18px}
.vf-btn--primary.vf-btn--sm{padding-left:36px;-webkit-mask:radial-gradient(circle 4px at 16px 50%,transparent 97%,#000 100%);mask:radial-gradient(circle 4px at 16px 50%,transparent 97%,#000 100%)}
.vf-btn--primary.vf-btn--sm::before{left:10px;width:12px;height:12px;margin-top:-6px}
.vf-btn:focus-visible{outline:2px solid var(--vf-text);outline-offset:3px}
.vf-btn:disabled,.vf-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
.vf-btn[aria-busy="true"]{cursor:progress;opacity:.8}
@media (prefers-reduced-motion:reduce){.vf-btn{transition:none}.vf-btn:hover,.vf-btn:active{transform:none}}

/* title: Поля · карта-наряд */
/* Подпись — трафаретом над полем, поле — светлая накладка с тонкой кромкой. */
.vf-field{display:grid;gap:6px;border:0;margin:0;padding:0;min-width:0}
.vf-field > span,.vf-field > legend{font-family:var(--vf-font-display);font-weight:700;font-size:15px;line-height:1.1;letter-spacing:.08em;text-transform:uppercase;color:currentColor;padding:0}
.vf-input{width:100%;min-height:50px;padding:12px 14px;border:0;border-radius:var(--vf-radius);background:var(--vf-surface);color:var(--vf-text);box-shadow:inset 0 0 0 1px rgba(27,33,37,.28),inset 0 2px 3px rgba(27,33,37,.08);font:400 18px/1.3 var(--vf-font-text);transition:box-shadow .2s,background-color .2s;caret-color:var(--vf-accent)}
.vf-input::placeholder{color:#6a7276;opacity:1}
.vf-input:hover{box-shadow:inset 0 0 0 1px rgba(27,33,37,.5),inset 0 2px 3px rgba(27,33,37,.08)}
.vf-input:focus{outline:0;background:#fff;box-shadow:inset 0 0 0 2px var(--vf-text)}
.vf-input[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--vf-danger);background:#fff6f5}
.vf-input:disabled{opacity:.55}
textarea.vf-input{min-height:104px;resize:vertical;line-height:1.45}
input[type="file"].vf-input{padding:11px 12px;font-size:16px}
input[type="file"].vf-input::file-selector-button{margin-right:12px;padding:6px 12px;border:0;border-radius:3px;background:var(--vf-text);color:var(--vf-surface);font:700 15px/1.1 var(--vf-font-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
@media (max-width:820px){.vf-input{font-size:17px}}
@media (prefers-reduced-motion:reduce){.vf-input{transition:none}}

/* ── r3-tech-works ── */
[data-part="r3-tech-works"]{position:relative;padding:clamp(64px,8vw,120px) 0 clamp(56px,7vw,104px);background:var(--vf-graph,#1a1f22);color:var(--vf-on-graph,#e4e9eb)}
[data-part="r3-tech-works"] ::selection{background:var(--vf-primer,#cbd252);color:#1b2125}
[data-part="r3-tech-works"] .r3wk__head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px clamp(24px,5vw,80px);align-items:end;padding:0 var(--vf-pad,28px);margin-bottom:clamp(28px,4vw,52px)}
[data-part="r3-tech-works"] .r3wk__h{font:900 clamp(56px,8vw,140px)/.84 var(--vf-font-display);text-transform:uppercase;letter-spacing:-.01em;color:var(--vf-primer,#cbd252)}
[data-part="r3-tech-works"] .r3wk__p{max-width:50ch;font-size:18px;line-height:1.5;color:var(--vf-on-graph-2,#a7afb3)}
[data-part="r3-tech-works"] .r3wk__hero{margin:0 0 clamp(10px,1vw,14px)}
[data-part="r3-tech-works"] .r3wk__hero img{width:100%;height:min(82vh,860px);min-height:320px;object-fit:cover;object-position:50% 45%}
[data-part="r3-tech-works"] .r3wk__hero figcaption{padding:10px var(--vf-pad,28px) 0;font-size:14px;color:var(--vf-on-graph-2,#a7afb3)}
[data-part="r3-tech-works"] .r3wk__grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:clamp(150px,17vw,300px);gap:clamp(8px,1vw,14px);margin:clamp(28px,4vw,56px) 0 0;padding:0 var(--vf-pad,28px);list-style:none}
[data-part="r3-tech-works"] .r3wk__c--a{grid-column:1/6;grid-row:1/3}
[data-part="r3-tech-works"] .r3wk__c--b{grid-column:6/9;grid-row:1/3}
[data-part="r3-tech-works"] .r3wk__c--c{grid-column:9/13;grid-row:1/2}
[data-part="r3-tech-works"] .r3wk__c--d{grid-column:9/13;grid-row:2/3}
[data-part="r3-tech-works"] .r3wk__c--e{grid-column:1/4;grid-row:3/5}
[data-part="r3-tech-works"] .r3wk__c--f{grid-column:4/8;grid-row:3/5}
[data-part="r3-tech-works"] .r3wk__c--g{grid-column:8/13;grid-row:3/5}
[data-part="r3-tech-works"] .r3wk__open{position:relative;display:block;width:100%;height:100%;padding:0;border:0;border-radius:8px;overflow:hidden;background:var(--vf-graph-2,#262c30);cursor:zoom-in}
[data-part="r3-tech-works"] .r3wk__open img,[data-part="r3-tech-works"] .r3wk__open video{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--vf-ease)}
[data-part="r3-tech-works"] .r3wk__open:hover img,[data-part="r3-tech-works"] .r3wk__open:hover video{transform:scale(1.035)}
[data-part="r3-tech-works"] .r3wk__open:focus-visible{outline:2px solid var(--vf-primer,#cbd252);outline-offset:3px}
[data-part="r3-tech-works"] .r3wk__cap{position:absolute;left:10px;bottom:10px;padding:6px 9px 5px;border-radius:3px;background:rgba(26,31,34,.82);font:700 14px/1 var(--vf-font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--vf-on-graph,#e4e9eb)}
@media (max-width:899px){
  [data-part="r3-tech-works"] .r3wk__head{grid-template-columns:1fr}
  [data-part="r3-tech-works"] .r3wk__h{font-size:clamp(52px,16vw,84px)}
  [data-part="r3-tech-works"] .r3wk__p{font-size:17px}
  [data-part="r3-tech-works"] .r3wk__hero img{height:58svh}
  [data-part="r3-tech-works"] .r3wk__grid{grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:44vw;padding:0 12px}
  [data-part="r3-tech-works"] .r3wk__c--a{grid-column:1/5;grid-row:span 2}
  [data-part="r3-tech-works"] .r3wk__c--b{grid-column:5/7;grid-row:span 2}
  [data-part="r3-tech-works"] .r3wk__c--c{grid-column:1/4;grid-row:auto}
  [data-part="r3-tech-works"] .r3wk__c--d{grid-column:4/7;grid-row:auto}
  [data-part="r3-tech-works"] .r3wk__c--e{grid-column:1/3;grid-row:span 2}
  [data-part="r3-tech-works"] .r3wk__c--f{grid-column:3/7;grid-row:span 2}
  [data-part="r3-tech-works"] .r3wk__c--g{grid-column:1/7;grid-row:auto}
  [data-part="r3-tech-works"] .r3wk__cap{font-size:12px;left:6px;bottom:6px}
}
@media (prefers-reduced-motion:reduce){[data-part="r3-tech-works"] .r3wk__open img,[data-part="r3-tech-works"] .r3wk__open video{transition:none}}


/* ── r3-tech-viewer ── */
[data-part="r3-tech-viewer"] .r3vw__dlg{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:var(--vf-graph,#1a1f22);color:var(--vf-on-graph,#e4e9eb);overflow:hidden}
[data-part="r3-tech-viewer"] .r3vw__dlg::backdrop{background:rgba(10,12,14,.7)}
[data-part="r3-tech-viewer"] .r3vw__dlg[open]{display:grid;grid-template-rows:1fr auto;animation:r3vw-in .35s var(--vf-ease)}
[data-part="r3-tech-viewer"] .r3vw__stage{display:grid;place-items:center;min-height:0;padding:clamp(56px,6vw,80px) clamp(16px,7vw,110px) 12px}
[data-part="r3-tech-viewer"] .r3vw__media{position:relative;display:grid;place-items:center;max-width:100%;max-height:100%;min-height:0;padding:10px;border-radius:14px;background:var(--vf-surface,#edf1f2);box-shadow:0 20px 50px -20px #000}
[data-part="r3-tech-viewer"] .r3vw__media img,[data-part="r3-tech-viewer"] .r3vw__media video{max-width:min(100%,1400px);max-height:calc(100dvh - 170px);width:auto;height:auto;border-radius:6px;background:#000}
[data-part="r3-tech-viewer"] .r3vw__cap{padding:0 20px 22px;text-align:center;font-size:16px;color:var(--vf-on-graph-2,#a7afb3)}
[data-part="r3-tech-viewer"] .r3vw__btn{position:absolute;display:grid;place-items:center;width:52px;height:52px;border:0;border-radius:4px;background:rgba(228,233,235,.08);box-shadow:inset 0 0 0 1.5px rgba(228,233,235,.5);color:inherit;cursor:pointer}
[data-part="r3-tech-viewer"] .r3vw__btn:hover{background:rgba(228,233,235,.16)}
[data-part="r3-tech-viewer"] .r3vw__btn:focus-visible{outline:2px solid var(--vf-primer,#cbd252);outline-offset:2px}
[data-part="r3-tech-viewer"] .r3vw__btn svg{width:22px;height:22px}
[data-part="r3-tech-viewer"] .r3vw__prev{left:clamp(8px,2vw,28px);top:50%;margin-top:-26px}
[data-part="r3-tech-viewer"] .r3vw__next{right:clamp(8px,2vw,28px);top:50%;margin-top:-26px}
[data-part="r3-tech-viewer"] .r3vw__close{right:clamp(8px,2vw,28px);top:clamp(8px,2vw,20px)}
@keyframes r3vw-in{from{clip-path:inset(8% 8% 8% 8% round 14px);opacity:.4}to{clip-path:inset(0 round 0);opacity:1}}

<script>
// VF kit: запуск JS компонентов после сборки страницы
window.VFKit = window.VFKit || {
  parts: {},
  register(id, init) { this.parts[id] = init; },
  boot() {
    document.querySelectorAll('[data-part]').forEach(root => {
      const init = this.parts[root.dataset.part];
      if (!init || root.__vfBooted) return;
      root.__vfBooted = true;
      try { init(root); } catch (err) { console.error(`[VFKit] ${root.dataset.part}:`, err); }
    });
    // По умолчанию «записаться» прокручивает к слоту заявки, если его компонент не перехватил событие
    document.addEventListener('vf:book', e => {
      if (e.defaultPrevented) return;
      document.querySelector('[data-slot="booking"]')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    });
  },
};

</script>

<script>
/* ── r3-tech-works ── */
;(() => {
VFKit.register('r3-tech-works', root => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const vids = [...root.querySelectorAll('video')];
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting && !reduce.matches) e.target.play().catch(() => {}); else e.target.pause();
    }), { threshold: 0.35 });
    vids.forEach(v => io.observe(v));
  }
  const btns = [...root.querySelectorAll('.r3wk__open')];
  const items = btns.map(b => ({ type: b.dataset.type, src: b.dataset.src, alt: b.dataset.alt, poster: b.querySelector('video')?.getAttribute('poster') || '' }));
  btns.forEach((b, i) => b.addEventListener('click', () => {
    const ev = new CustomEvent('vf:view', { cancelable: true, detail: { items, index: i, opener: b } });
    document.dispatchEvent(ev);
    if (!ev.defaultPrevented) window.open(items[i].src, '_blank', 'noopener');
  }));
});

})();

/* ── r3-tech-viewer ── */
;(() => {
VFKit.register('r3-tech-viewer', root => {
  const dlg = root.querySelector('.r3vw__dlg');
  const box = root.querySelector('.r3vw__media');
  const cap = root.querySelector('.r3vw__cap');
  let items = [], i = 0, opener = null, x0 = null;
  function render() {
    const it = items[i];
    box.textContent = '';
    let m;
    if (it.type === 'vid') {
      m = document.createElement('video');
      Object.assign(m, { src: it.src, muted: true, loop: true, playsInline: true, controls: true, autoplay: !matchMedia('(prefers-reduced-motion: reduce)').matches });
      if (it.poster) m.poster = it.poster;
      m.setAttribute('aria-label', it.alt);
    } else {
      m = document.createElement('img'); m.src = it.src; m.alt = it.alt;
    }
    box.appendChild(m);
    cap.textContent = `${it.alt} — ${i + 1} из ${items.length}`;
  }
  const go = d => { i = (i + d + items.length) % items.length; render(); };
  document.addEventListener('vf:view', e => {
    if (!e.detail?.items?.length) return;
    e.preventDefault();
    items = e.detail.items; i = e.detail.index || 0; opener = e.detail.opener || null;
    render(); dlg.showModal();
  });
  root.querySelector('.r3vw__prev').addEventListener('click', () => go(-1));
  root.querySelector('.r3vw__next').addEventListener('click', () => go(1));
  root.querySelector('.r3vw__close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
  dlg.addEventListener('close', () => { box.textContent = ''; opener?.focus(); });
  dlg.addEventListener('pointerdown', e => { x0 = e.clientX; });
  dlg.addEventListener('pointerup', e => { if (x0 !== null && Math.abs(e.clientX - x0) > 50) go(e.clientX < x0 ? 1 : -1); x0 = null; });
  dlg.addEventListener('click', e => { if (e.target === dlg || e.target.classList.contains('r3vw__stage')) dlg.close(); });
});

})();
</script>
