<section data-part="r3-easy-services-rail" data-slot="services" class="r3sv" aria-labelledby="r3sv-title">
  <div class="r3sv__in">
    <div class="r3sv__top">
      <h2 id="r3sv-title" class="r3sv__title">Что принимаем в&nbsp;работу</h2>
      <p class="r3sv__lede">Снимите нужную бирку — услуга сама впишется в&nbsp;заявку.</p>
    </div>
    <div class="r3sv__rail" role="list">
      <div class="r3sv__item" role="listitem" style="--drop: 22px">
        <button class="r3sv__tag r3sv__tag--red" type="button" data-symptom="Нужна диагностика">
          <span class="r3sv__eye" aria-hidden="true"></span>
          <span class="r3sv__name">Диагностика</span>
          <span class="r3sv__text">Бесплатно. Мастер смотрит механизм и&nbsp;говорит, что нужно сделать.</span>
          <span class="r3sv__go">В&nbsp;заявку</span>
        </button>
      </div>
      <div class="r3sv__item" role="listitem" style="--drop: 58px">
        <button class="r3sv__tag" type="button" data-symptom="Ремонт или обслуживание механизма">
          <span class="r3sv__eye" aria-hidden="true"></span>
          <span class="r3sv__name">Ремонт и&nbsp;обслуживание механизма</span>
          <span class="r3sv__text">Разборка до&nbsp;последнего винта, оригинальные комплектующие.</span>
          <span class="r3sv__go">В&nbsp;заявку</span>
        </button>
      </div>
      <div class="r3sv__item" role="listitem" style="--drop: 34px">
        <button class="r3sv__tag" type="button" data-symptom="Полировка">
          <span class="r3sv__eye" aria-hidden="true"></span>
          <span class="r3sv__name">Полировка</span>
          <span class="r3sv__text">Корпус и&nbsp;браслет — с&nbsp;ювелирной точностью.</span>
          <span class="r3sv__go">В&nbsp;заявку</span>
        </button>
      </div>
      <div class="r3sv__item" role="listitem" style="--drop: 70px">
        <button class="r3sv__tag" type="button" data-symptom="Замена элемента питания">
          <span class="r3sv__eye" aria-hidden="true"></span>
          <span class="r3sv__name">Замена элемента питания</span>
          <span class="r3sv__text">С&nbsp;сохранением герметичности — проверяем на&nbsp;тестере.</span>
          <span class="r3sv__go">В&nbsp;заявку</span>
        </button>
      </div>
      <div class="r3sv__item" role="listitem" style="--drop: 28px">
        <button class="r3sv__tag" type="button" data-symptom="Ремешок или браслет">
          <span class="r3sv__eye" aria-hidden="true"></span>
          <span class="r3sv__name">Ремешки и&nbsp;браслеты</span>
          <span class="r3sv__text">Замена ремешка, ремонт браслета по&nbsp;звеньям.</span>
          <span class="r3sv__go">В&nbsp;заявку</span>
        </button>
      </div>
      <div class="r3sv__item" role="listitem" style="--drop: 50px">
        <button class="r3sv__tag" type="button" data-symptom="Замена стекла">
          <span class="r3sv__eye" aria-hidden="true"></span>
          <span class="r3sv__name">Замена стекла</span>
          <span class="r3sv__text">Разбитое или поцарапанное стекло.</span>
          <span class="r3sv__go">В&nbsp;заявку</span>
        </button>
      </div>
    </div>
  </div>
</section>
