<section data-part="r3-easy-works-prints" data-slot="works" class="r3wk" aria-labelledby="r3wk-title">
  <div class="r3wk__in">
    <div class="r3wk__top">
      <h2 id="r3wk-title" class="r3wk__title">Кадры с&nbsp;верстака</h2>
      <p class="r3wk__lede">Снимки сделаны в&nbsp;мастерской на&nbsp;Петровке: так выглядит работа, пока часы у&nbsp;мастера.</p>
    </div>

    <div class="r3wk__board">
      <div class="r3wk__col r3wk__col--a">
        <figure class="r3wk__print r3wk__print--wide r3wk__print--tape" style="--rot: -1.6deg">

        </figure>
        <figure class="r3wk__print" style="--rot: 1.8deg">
          <img src="{{media}}/img/ex_5-s.webp" srcset="{{media}}/img/ex_5-s.webp 420w, {{media}}/img/ex_5.webp 600w" sizes="(max-width: 820px) 62vw, 300px" width="420" height="560" alt="Детали механизма разложены по ячейкам лотка: мосты, колёса, винты." loading="lazy" decoding="async">
          <figcaption>Детали по&nbsp;ячейкам, ничего не&nbsp;теряется</figcaption>
        </figure>
      </div>
      <div class="r3wk__col r3wk__col--b">
        <figure class="r3wk__print r3wk__print--big" style="--rot: 1.2deg">

          <figcaption>Разборка пинцетом, до&nbsp;последнего винта</figcaption>
        </figure>
        <figure class="r3wk__print r3wk__print--wide" style="--rot: -1deg">
          <img src="{{media}}/img/ex_36-s.webp" srcset="{{media}}/img/ex_36-s.webp 560w, {{media}}/img/ex_36.webp 866w" sizes="(max-width: 820px) 70vw, 380px" width="560" height="409" alt="Баланс с волоском и мост механизма рядом на светлой поверхности." loading="lazy" decoding="async">

        </figure>

      <div class="r3wk__col r3wk__col--c">
        <figure class="r3wk__print" style="--rot: -2.4deg">
          <img src="{{media}}/img/ex_2-s.webp" srcset="{{media}}/img/ex_2-s.webp 420w, {{media}}/img/ex_2.webp 600w" sizes="(max-width: 820px) 62vw, 300px" width="420" height="560" alt="Механизм на держателе на синем коврике верстака, вид сверху." loading="lazy" decoding="async">

        </figure>
        <figure class="r3wk__print r3wk__print--tape" style="--rot: 2deg">
          <img src="{{media}}/img/ex_1-s.webp" srcset="{{media}}/img/ex_1-s.webp 420w, {{media}}/img/ex_1.webp 600w" sizes="(max-width: 820px) 62vw, 300px" width="420" height="560" alt="Часы с золотистым браслетом лежат на фирменной подложке мастерской." loading="lazy" decoding="async">
