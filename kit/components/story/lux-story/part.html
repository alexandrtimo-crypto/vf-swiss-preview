<section data-part="lux-story" data-slot="story" class="lux-story" id="atelier" aria-labelledby="lux-atelierTitle">
  <h2 class="sr" id="lux-atelierTitle">Ателье</h2>
  <div class="atelier__pin">
    <div class="atelier__track" tabindex="0" aria-label="Кадры ателье, прокручиваются вбок">

      <figure class="frame frame--full">
        <div class="frame__media"><img src="{{media}}/img/ex_32.webp" width="1200" height="900" alt="Латунное колесо часового механизма крупным планом" class="tone"></div>
        <figcaption class="frame__say"><span class="say-sm">в каждой детали</span><span class="say-xl">Ювелирная<br><em>точность</em></span></figcaption>
        <span class="frame__hint" aria-hidden="true">листайте</span>
      </figure>

      <figure class="frame frame--paper">
        <div class="frame__media"><img src="{{media}}/vid/ex_18.webp" width="360" height="640" alt="Циферблат Rolex Datejust в руках мастера в перчатках" class="tone tone--soft"></div>
        <figcaption class="frame__say"><span class="say-xl">Оригинальные<br><em>комплектующие</em></span><span class="say-sm">и ничего случайного</span></figcaption>
      </figure>

      <figure class="frame frame--loupe">
        <div class="frame__media"><img src="{{media}}/img/ex_3.webp" width="600" height="800" alt="Пинцет над открытым механизмом" class="tone tone--cool" loading="lazy"></div>
        <figcaption class="frame__say"><span class="say-sm">оборудование ателье</span><span class="say-xl">Микроскоп<br><em>Таймграфер</em><br>Тестер<br>герметичности</span></figcaption>
      </figure>

      <figure class="frame frame--layer">
        <span class="frame__ghost" aria-hidden="true">Петровка</span>
        <div class="frame__media"><video muted loop playsinline preload="none" poster="{{media}}/vid/ex_14.webp" data-lazy-video aria-label="Часы из розового золота в руках мастера"><source src="{{media}}/vid/ex_14.mp4" type="video/mp4"></video></div>
        <figcaption class="frame__say"><span class="say-sm">Москва, Петровка 23/10</span><span class="say-xl">Мастерская<br><em>в центре города</em></span></figcaption>
      </figure>

      <figure class="frame frame--blend">
        <div class="frame__media"><img src="{{media}}/img/ex_36.webp" width="866" height="633" alt="Баланс и мелкие детали механизма на светлом столе" loading="lazy"></div>
        <figcaption class="frame__say"><span class="say-xl">Диагностика —<br><em>бесплатно</em></span><a class="frame__link vf-btn vf-btn--ghost" href="#visit" data-book>Записаться в ателье</a></figcaption>
      </figure>

    </div>
    <div class="atelier__rail" aria-hidden="true"><span></span></div>
    <div class="atelier__nav"><button type="button" data-dir="-1" aria-label="Предыдущий кадр">‹</button><button type="button" data-dir="1" aria-label="Следующий кадр">›</button></div>
  </div>
</section>
