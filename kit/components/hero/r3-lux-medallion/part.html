<section data-part="r3-lux-medallion" data-slot="hero" class="r3lm" id="top" aria-labelledby="r3lm-h">
  <div class="r3lm__sheet">
    <figure class="r3lm__medal">
      <div class="r3lm__ros" data-ros></div>
      <div class="r3lm__oval" data-oval>
        <div class="r3lm__ph"><img src="{{media}}/img/ex_1.webp" width="600" height="800" alt="Золотые часы на браслете на верстаке мастерской VF swiss" fetchpriority="high"></div>
        <div class="r3lm__fr" data-fr></div>
      </div>
      <figcaption class="r3lm__cap">Часы клиента на верстаке мастерской</figcaption>
    </figure>
    <div class="r3lm__copy">
      <h1 class="r3lm__h" id="r3lm-h"><span>Часы — это&nbsp;ценность.</span> <span>Мы&nbsp;принимаем их&nbsp;так</span></h1>
      <p class="r3lm__lead">Полная разборка, оригинальные детали, гарантия до&nbsp;двух лет. Диагностика бесплатно.</p>
      <form class="r3lm__blank" novalidate aria-labelledby="r3lm-bl-h">
        <div class="r3lm__in">
          <div class="r3lm__top">
            <p class="r3lm__title" id="r3lm-bl-h">Бланк записи</p>
          </div>
          <label class="vf-field"><span>Телефон</span><input class="vf-input" type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="+7 (___) ___-__-__" required aria-describedby="r3lm-err"></label>
          <div class="r3lm__alt">
            <a class="vf-btn vf-btn--ghost vf-btn--sm" href="tel:+79651716996" data-sound="click"><i class="vf-i vf-i--phone" aria-hidden="true"></i>Позвонить</a>
            <a class="vf-btn vf-btn--ghost vf-btn--sm" href="https://t.me/VFswissboutique" data-sound="click"><i class="vf-i vf-i--telegram" aria-hidden="true"></i>Telegram</a>
          </div>
          <label class="r3lm__consent"><input type="checkbox" name="consent" required><span>Согласен на обработку персональных данных (<a href="#r3-policy">политика</a>)</span></label>
          <label class="r3lm__hp" aria-hidden="true">Сайт <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
          <p class="r3lm__err" id="r3lm-err" role="alert" hidden></p>
          <button class="vf-btn vf-btn--primary r3lm__go" type="submit">Записаться на диагностику</button>
        </div>
        <p class="r3lm__no" data-no aria-label="Номер бланка">№ ———</p>
        <div class="r3lm__done" hidden tabindex="-1">
          <p class="r3lm__done-h">Заявка принята</p>
          <p class="r3lm__done-p">Это прототип: заявка никуда не отправлена. На рабочем сайте мастер свяжется <span data-via>по телефону</span>.</p>
          <button class="vf-btn vf-btn--ghost vf-btn--sm r3lm__again" type="button">Новая заявка</button>
          <svg class="r3lm__stamp" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><defs><path id="r3lm-sp" d="M100 100m-72 0a72 72 0 1 1 144 0a72 72 0 1 1-144 0"/><filter id="r3lm-rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter></defs><g filter="url(#r3lm-rough)" fill="none" stroke="currentColor"><circle cx="100" cy="100" r="95" stroke-width="3"/><circle cx="100" cy="100" r="88" stroke-width="1"/><circle cx="100" cy="100" r="60" stroke-width="1.4"/><text fill="currentColor" stroke="none" font-family="Old Standard TT,serif" font-weight="700" font-size="14" letter-spacing="3.2"><textPath href="#r3lm-sp" startOffset="0" textLength="450" lengthAdjust="spacing">VF SWISS · ПЕТРОВКА 23/10 · ПРОТОТИП ·</textPath></text><text x="100" y="104" text-anchor="middle" fill="currentColor" stroke="none" font-family="Old Standard TT,serif" font-weight="700" font-size="21" letter-spacing=".8">ПРИНЯТО</text><text x="100" y="124" text-anchor="middle" fill="currentColor" stroke="none" font-family="Golos Text,sans-serif" font-weight="600" font-size="9.5" letter-spacing="2">(ПРОТОТИП)</text></g></svg>
        </div>
      </form>
    </div>
  </div>
</section>
