<section data-part="easy-hero" data-slot="hero" class="easy-hero" aria-labelledby="easy-hero-q">
  <div class="easy-hero__left">
    <div class="easy-hero__talk">
      <div class="easy-hero__master" aria-hidden="true" data-icon="master"></div>
      <p class="easy-hero__bubble">Здравствуйте! Я помощник мастерской. Нажмите, что случилось, — подскажу и&nbsp;запишу на&nbsp;<b>бесплатную диагностику</b>.</p>
    </div>
    <h2 class="easy-hero__q" id="easy-hero-q">Что с&nbsp;часами?</h2>
    <h1 class="easy-hero__seo">Ремонт и обслуживание швейцарских часов в&nbsp;Москве — мастерская на&nbsp;Петровке</h1>
  </div>

  <div class="easy-hero__tiles" role="list">
    <button class="tile" type="button" role="listitem" data-tile="stop" style="--c:var(--vf-easy-sun, #FFD25E);--r:-2.2deg"><span class="tile__ico" data-icon="stop"></span><span class="tile__t">Остановились</span></button>
    <button class="tile" type="button" role="listitem" data-tile="drift" style="--c:var(--vf-easy-sky, #9FD8FF);--r:1.6deg"><span class="tile__ico" data-icon="drift"></span><span class="tile__t">Отстают или спешат</span></button>
    <button class="tile" type="button" role="listitem" data-tile="glass" style="--c:var(--vf-easy-coral, #FFA98F);--r:-1.2deg"><span class="tile__ico" data-icon="glass"></span><span class="tile__t">Разбито стекло</span></button>
    <button class="tile" type="button" role="listitem" data-tile="polish" style="--c:var(--vf-easy-lilac, #C8B6FF);--r:2deg"><span class="tile__ico" data-icon="polish"></span><span class="tile__t">Нужна полировка</span></button>
    <button class="tile" type="button" role="listitem" data-tile="strap" style="--c:var(--vf-easy-mint, #8EE0B8);--r:-1.6deg"><span class="tile__ico" data-icon="strap"></span><span class="tile__t">Ремешок или браслет</span></button>
    <button class="tile" type="button" role="listitem" data-tile="battery" style="--c:var(--vf-easy-pink, #FFC2DA);--r:1.2deg"><span class="tile__ico" data-icon="battery"></span><span class="tile__t">Батарейка</span></button>
    <button class="tile" type="button" role="listitem" data-tile="service" style="--c:var(--vf-easy-lime, #B9E37A);--r:-2deg"><span class="tile__ico" data-icon="service"></span><span class="tile__t">Плановое обслуживание</span></button>
    <button class="tile tile--unsure" type="button" role="listitem" data-tile="unknown" style="--c:var(--vf-surface, #fff);--r:1.4deg"><span class="tile__ico" data-icon="unknown"></span><span class="tile__t">Не знаю — посмотрите</span></button>
  </div>

  <noscript><p class="easy-hero__nojs">Позвоните <a href="tel:+79651716996">8 (965) 171-69-96</a> или напишите в&nbsp;<a href="https://t.me/VFswissboutique">Telegram</a> — диагностика бесплатная.</p></noscript>
</section>
